name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  static:
    name: PHP ${{ matrix.php }} — phpstan + cs-fixer
    runs-on: ubuntu-latest
    # ubuntu-latest ships npm, so a plain `composer install` would otherwise
    # fire the post-install `garnet setup` hook and npm-install FrontBuilder
    # on every PHP job. Suppress the node half here; the frontend/zero-config
    # jobs run it deliberately.
    env:
      GARNET_SKIP_NODE_SETUP: '1'
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist --no-interaction

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (phpstan)
        run: composer phpstan

  kernel-tests:
    name: PHP ${{ matrix.php }} — kahlan Kernel (no DB)
    runs-on: ubuntu-latest
    env:
      GARNET_SKIP_NODE_SETUP: '1'
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist --no-interaction

      - name: Kernel specs
        run: composer test:kernel

  bundle-tests:
    name: PHP ${{ matrix.php }} — kahlan Bundle (MySQL)
    runs-on: ubuntu-latest
    env:
      GARNET_SKIP_NODE_SETUP: '1'
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        # The default health probe takes ~30 s to flip "healthy"; we wait
        # via mysqladmin below before running tests anyway. Keep this short
        # so a sick container fails fast.
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist --no-interaction

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u test -ptest --silent; then
              echo "MySQL up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL never came up"; exit 1

      - name: Bundle specs
        # TestsInit/TestConfig/db.ini targets host=127.0.0.1 (not
        # "localhost" — PHP/mysqli treats literal "localhost" as a Unix
        # socket request, which fails against Docker service containers),
        # port=3306, user=test, password=test, dbname=test — matches the
        # service container exactly, so no config override is needed.
        run: composer test:bundle

  frontend:
    name: Frontend — oxlint + tsgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FrontBuilder/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      # Install PHP deps only; the explicit `garnet setup` below does the
      # node half so we exercise the real installer (npm + the node_modules
      # junction at the framework root that tsgo/oxlint resolve through).
      - name: Install PHP deps
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --prefer-dist --no-interaction

      - name: Set up frontend toolchain (garnet setup)
        run: php bin/garnet setup --skip-composer

      - name: oxlint + tsgo
        working-directory: FrontBuilder
        run: npm run check

  admin-bundle-staleness:
    name: Admin bundle staleness — committed dist matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FrontBuilder/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      # The admin bundle imports framework frontend sources (Bundle/Front via
      # the @common alias) that resolve through the framework-root node_modules
      # junction, so we need the same garnet setup as the frontend job — a bare
      # `npm ci` in FrontBuilder alone would leave Bundle/Front imports
      # unresolved. See the `frontend` job for the same recipe.
      - name: Install PHP deps
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --prefer-dist --no-interaction

      - name: Set up frontend toolchain (garnet setup)
        run: php bin/garnet setup --skip-composer

      - name: Rebuild admin bundle from current source
        working-directory: FrontBuilder
        run: npx cross-env NODE_ENV=production npx rspack build --config rspack.admin.config.ts

      # The committed Kernel/Io/GarnetCli/Admin/dist/** is shipped to Packagist
      # (carved out of .gitignore's **/dist/** rule). If a .tsx change lands
      # without rebuilding, the shipped admin console silently drifts out of
      # sync with its server-side CSRF/exec-ticket contract — exactly the
      # defect this guard exists to stop recurring. Fail the build if a clean
      # rebuild from current source does not reproduce the committed bundle.
      #
      # Why "normalized" rather than a raw `git diff --exit-code`: the JS
      # bundles (swc — a Rust core) are byte-deterministic across OSes, but
      # admin.css is minified by lightningcss, whose sRGB→lab() colour
      # conversion yields last-decimal FP-rounding variance between its
      # platform-native binaries (win32-x64-msvc vs linux-x64-gnu) — visually
      # identical colours that are NOT byte-identical across Windows/Linux.
      # Truncating every decimal to 3 places on BOTH sides makes the compare
      # stable on any contributor's OS (a no-op for the JS, which carries no
      # 4+-digit decimals) while still catching every real drift: structural
      # CSS changes, new/changed JS, and added/dropped chunk files. ([.] is
      # used instead of \. so the regex needs no shell backslash escaping.)
      - name: Fail if committed dist diverges from a clean rebuild
        run: |
          DIST=Kernel/Io/GarnetCli/Admin/dist
          # Truncate every decimal to 3 places (no-op on the JS bundles,
          # which carry no 4+-digit decimals). Written to a file so the
          # regex isn't at the mercy of any shell's backslash / `$1`
          # quoting — behaves identically on every contributor's OS.
          printf '%s\n' 's/([.][0-9]{3})[0-9]+/$1/g' > /tmp/garnet_admin_norm.pl
          norm() { perl -p /tmp/garnet_admin_norm.pl; }
          status=0

          # Every committed dist file must match the rebuild (normalized).
          while IFS= read -r f; do
            if ! diff -u <(git show "HEAD:$f" | norm) <(norm < "$f") >/dev/null; then
              echo "::error::$f diverges from a clean rebuild (normalized). Rebuild: cd FrontBuilder && npx cross-env NODE_ENV=production npx rspack build --config rspack.admin.config.ts, then commit $DIST/**"
              status=1
            fi
          done < <(git ls-tree -r --name-only HEAD -- "$DIST")

          # The rebuild must produce exactly the committed file set (catches a
          # new/dropped chunk the per-file loop above wouldn't visit).
          committed=$(git ls-tree -r --name-only HEAD -- "$DIST" | sed "s|^$DIST/||" | sort)
          built=$(ls -1 "$DIST" | sort)
          if [ "$committed" != "$built" ]; then
            echo "::error::Admin dist file set diverges. committed vs built:"
            diff <(printf '%s\n' "$committed") <(printf '%s\n' "$built") || true
            status=1
          fi

          exit $status

  zero-config:
    name: Zero-config — setup → app:create → build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FrontBuilder/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      - name: Install PHP deps
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --prefer-dist --no-interaction

      # The framework installer: FrontBuilder npm + node_modules junction.
      # Idempotent; this is the same command the quickstart documents.
      - name: garnet setup (framework)
        run: php bin/garnet setup --skip-composer

      # Scaffold an app. GARNET_SKIP_NODE_SETUP keeps app:create's own
      # composer install from downloading Playwright browsers in CI; we
      # install the app node deps explicitly (sans browsers) next.
      - name: Scaffold an app from the template
        run: GARNET_SKIP_NODE_SETUP=1 php bin/garnet app:create CiApp --target="${{ runner.temp }}/CiApp"

      - name: App node deps (no Playwright browsers)
        working-directory: ${{ runner.temp }}/CiApp
        run: php garnet setup --skip-composer --skip-playwright

      - name: Build the app (framework FrontBuilder)
        working-directory: ${{ runner.temp }}/CiApp
        run: php garnet build

      - name: Verify built assets
        working-directory: ${{ runner.temp }}/CiApp
        run: php garnet build:check

      - name: App quality gate (cs-fixer + phpstan)
        working-directory: ${{ runner.temp }}/CiApp
        run: composer ci

  e2e:
    name: E2E — setup → app:create → Playwright smoke
    runs-on: ubuntu-latest
    # Env::isDevDir() decides "dev mode" (reads WorkDir/ConfigDev/ — the
    # zero-config quickstart defaults) vs "production mode" (reads
    # WorkDir/Config/, empty on a fresh scaffold with no deploy/config:init
    # step). GARNET_ENV=dev short-circuits the heuristic explicitly instead
    # of relying on an IDE-marker directory being present by accident; a
    # bare CI checkout has none, so without this a freshly-scaffolded app
    # 500s on every request (IniConfigException: Wrong file
    # .../WorkDir/Config/db.ini) because nothing ever populated the
    # production Config/ dir.
    env:
      GARNET_ENV: dev
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FrontBuilder/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      - name: Install PHP deps
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --prefer-dist --no-interaction

      # The framework installer: FrontBuilder npm + node_modules junction.
      - name: garnet setup (framework)
        run: php bin/garnet setup --skip-composer

      # Scaffold an app. GARNET_SKIP_NODE_SETUP keeps app:create's own
      # composer install from downloading Playwright browsers via the
      # post-install hook; we run the app's own `garnet setup` explicitly
      # next, WITHOUT --skip-playwright this time, so the browsers install.
      - name: Scaffold an app from the template
        run: GARNET_SKIP_NODE_SETUP=1 php bin/garnet app:create CiApp --target="${{ runner.temp }}/CiApp"

      - name: App node deps + Playwright browsers
        working-directory: ${{ runner.temp }}/CiApp
        run: php garnet setup --skip-composer

      - name: Build the app (framework FrontBuilder)
        working-directory: ${{ runner.temp }}/CiApp
        run: php garnet build

      # Serve + test in ONE step. A background process started in a separate
      # step does not survive into the next one on GitHub-hosted runners, so
      # the server, the readiness wait, and the Playwright run must share a
      # step. These specs are all DB-free, so no MySQL service is needed.
      #
      # Only a safe subset of the ported framework-bundle specs runs here.
      # The scaffold now wires EmailAuthMiddleware::authOnly onto /account
      # (AccountController — see Application.php::runWebApp; / itself stays
      # public by design), so the other 8 specs under Tests/specs/
      # framework-bundle/ (auth-email-preserved-on-error, auth-magic-link-
      # defer, magic-link, registration-gate, consent-csrf, email-auth,
      # email-link-csrf, cookie-samesite) are no longer blocked by missing
      # auth wiring — verified manually (curl against /account renders the
      # real Auth2 login form). They ARE still excluded from THIS job
      # because they need a real MySQL database (session_data, accounts,
      # mail_log rows via mysql2) and this job runs DB-free with no MySQL
      # service configured. Wiring those in is a separate follow-up (add a
      # MySQL service + run migrations first — note: migration self-bootstrap
      # works fine, proven by the vendored-app-mode job; the remaining blocker
      # for consent-csrf.spec.ts specifically is the React island lazy-load
      # issue, not migrations). Do NOT add these specs to this DB-free job
      # without that MySQL service; doing so will make it red for a reason that
      # isn't a code bug.
      - name: Serve + Playwright smoke suite
        working-directory: ${{ runner.temp }}/CiApp
        env:
          GARNET_FRAMEWORK_PATH: ${{ github.workspace }}
        run: |
          php garnet serve > /tmp/garnet-serve.log 2>&1 &
          SERVER_PID=$!
          up=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8001/ > /dev/null; then up=1; break; fi
            sleep 2
          done
          if [ "$up" != "1" ]; then
            echo "Server did not come up in time." >&2
            echo "--- garnet serve log ---" >&2
            cat /tmp/garnet-serve.log >&2 || true
            echo "--- curl verbose (last attempt) ---" >&2
            curl -v http://localhost:8001/ 2>&1 >&2 || true
            echo "--- PHP error log (if any) ---" >&2
            find WorkDir -iname "*.log" -exec sh -c 'echo "== {} =="; cat "{}"' \; 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Server is up — running Playwright."
          npm --prefix Tests test -- \
            specs/smoke.spec.ts \
            specs/smoke/pageloader-incoming-state-ids-guard.spec.ts \
            specs/framework-bundle/api-no-react-import.spec.ts \
            specs/framework-bundle/cron-cli.spec.ts \
            specs/framework-bundle/html-lang.spec.ts \
            specs/framework-bundle/auth-page-chrome.spec.ts
          status=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $status

  dependency-install:
    name: Dependency install — app:create from vendor (no symlink)
    runs-on: ubuntu-latest
    # See the e2e job above for why Env::isDevDir() needs an explicit
    # override in CI.
    env:
      GARNET_ENV: dev
    steps:
      - uses: actions/checkout@v5
        with:
          path: garnet-framework

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      # Create a blank Composer project that pulls garnet-framework as a
      # normal dependency — NOT a symlinked path repo.  symlink:false makes
      # Composer physically copy the files into vendor/, which is the closest
      # approximation of a real Packagist install without network access.
      - name: Create consumer project
        run: |
          mkdir -p "${{ runner.temp }}/consumer"
          cd "${{ runner.temp }}/consumer"
          composer init \
            --name=test/consumer \
            --description="CI consumer project" \
            --stability=dev \
            --no-interaction
          composer config repositories.local \
            '{"type":"path","url":"'"$GITHUB_WORKSPACE/garnet-framework"'","options":{"symlink":false}}'
          composer config minimum-stability dev
          composer config prefer-stable true

      - name: Install garnet-framework as dependency
        working-directory: ${{ runner.temp }}/consumer
        run: |
          GARNET_SKIP_NODE_SETUP=1 composer require phpcraftdream/garnet-framework:@dev --no-interaction --no-progress

      # Scaffold an app via the vendor-installed CLI (not the checkout).
      - name: Scaffold TestApp via vendor/bin/garnet
        working-directory: ${{ runner.temp }}/consumer
        run: |
          GARNET_SKIP_NODE_SETUP=1 php vendor/bin/garnet app:create TestApp --target="${{ runner.temp }}/TestApp"

      # Remove the original checkout to prove TestApp is self-contained.
      - name: Remove framework checkout (prove independence)
        run: rm -rf "$GITHUB_WORKSPACE/garnet-framework"

      # Re-install TestApp deps — must succeed without the bootstrap checkout.
      - name: composer install in TestApp (no bootstrap)
        working-directory: ${{ runner.temp }}/TestApp
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --no-interaction

      - name: Setup TestApp frontend
        working-directory: ${{ runner.temp }}/TestApp
        run: php garnet setup --skip-composer --skip-playwright

      - name: Build TestApp
        working-directory: ${{ runner.temp }}/TestApp
        run: php garnet build

      - name: Verify built assets
        working-directory: ${{ runner.temp }}/TestApp
        run: php garnet build:check

  vendored-app-mode:
    name: Vendored app-mode — config:init → build → serve → DB smoke + framework-bundle specs (raw-HTTP only)
    runs-on: ubuntu-latest
    # See the e2e job above for why Env::isDevDir() needs an explicit
    # override in CI. This job's whole point is exercising the app as a
    # real Composer consumer would run it (GARNET_ROOT resolving through
    # vendor/, not a framework checkout at the repo root), so it deliberately
    # mirrors dependency-install's vendoring recipe instead of zero-config/
    # e2e's in-place scaffold-from-checkout.
    env:
      GARNET_ENV: dev
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
        with:
          path: garnet-framework

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, intl
          coverage: none
          tools: composer:v2

      # Same recipe as the dependency-install job: a path repo with
      # symlink:false makes Composer physically copy the framework into
      # vendor/phpcraftdream/garnet-framework instead of symlinking it —
      # the closest approximation of a real Packagist install without
      # depending on a live published release existing for every commit.
      # Verified locally that GarnetRunner::resolveFrameworkDir() (which
      # realpath()s the Composer-reported install path) lands on this
      # physical vendored copy, not the bootstrap checkout, confirming this
      # produces the same GARNET_ROOT-resolves-to-vendor-dir behaviour a
      # real Packagist install would.
      - name: Create consumer project
        run: |
          mkdir -p "${{ runner.temp }}/consumer"
          cd "${{ runner.temp }}/consumer"
          composer init \
            --name=test/consumer \
            --description="CI consumer project" \
            --stability=dev \
            --no-interaction
          composer config repositories.local \
            '{"type":"path","url":"'"$GITHUB_WORKSPACE/garnet-framework"'","options":{"symlink":false}}'
          composer config minimum-stability dev
          composer config prefer-stable true

      - name: Install garnet-framework as dependency
        working-directory: ${{ runner.temp }}/consumer
        run: |
          GARNET_SKIP_NODE_SETUP=1 composer require phpcraftdream/garnet-framework:@dev --no-interaction --no-progress

      # Scaffold an app via the vendor-installed CLI (not the checkout).
      - name: Scaffold TestApp via vendor/bin/garnet
        working-directory: ${{ runner.temp }}/consumer
        run: |
          GARNET_SKIP_NODE_SETUP=1 php vendor/bin/garnet app:create TestApp --target="${{ runner.temp }}/TestApp"

      - name: composer install in TestApp
        working-directory: ${{ runner.temp }}/TestApp
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --no-interaction

      # App node deps + Playwright browsers (no --skip-playwright — this job
      # runs the real Playwright smoke suite below).
      - name: TestApp node deps + Playwright browsers
        working-directory: ${{ runner.temp }}/TestApp
        run: php garnet setup --skip-composer

      # T2: the first command a genuinely new user runs, per docs/quickstart.md
      # ("php garnet config:init" seeds ssh.ini/deploy.ini from
      # ConfigExample/). Non-destructive — db.ini/app.ini/email.ini already
      # ship with dev defaults in ConfigDev/ and are left alone here; the DB
      # wiring below edits ConfigDev/db.ini directly to point at the CI
      # MySQL service.
      - name: garnet config:init
        working-directory: ${{ runner.temp }}/TestApp
        run: php garnet config:init

      # Point the scaffold's dev DB config at the CI MySQL service and
      # enable it. host=127.0.0.1 (not "localhost" — PHP/mysqli treats
      # literal "localhost" as a Unix socket request, which fails against
      # Docker service containers) — same reasoning as the bundle-tests job.
      - name: Wire TestApp db.ini to the MySQL service
        working-directory: ${{ runner.temp }}/TestApp
        run: |
          DB_INI="WorkDir/ConfigDev/db.ini"
          sed -i \
            -e 's/^enabled = 0/enabled = 1/' \
            -e 's/^dsn = .*/dsn = "mysql:host=127.0.0.1;port=3306;dbname=test;charset=utf8mb4"/' \
            -e 's/^dbname = .*/dbname = "test"/' \
            -e 's/^user = .*/user = "test"/' \
            -e 's/^password = .*/password = "test"/' \
            "$DB_INI"
          echo 'host = "127.0.0.1"' >> "$DB_INI"
          echo 'port = 3306' >> "$DB_INI"
          cat "$DB_INI"

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u test -ptest --silent; then
              echo "MySQL up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL never came up"; exit 1

      # T4: run the app's real migration chain against the real vendored
      # install — CMDMigration::migrate() self-bootstraps the tracker table
      # on a fresh DB, so this is the same bare command the docs tell users
      # to run.
      - name: garnet migration
        working-directory: ${{ runner.temp }}/TestApp
        run: php garnet migration

      - name: Build TestApp
        working-directory: ${{ runner.temp }}/TestApp
        run: php garnet build

      # Serve + test in ONE step — a background process started in a
      # separate step does not survive into the next one on GitHub-hosted
      # runners (see the e2e job above). Drives EmailAuthMiddleware's real
      # request-code flow over raw HTTP (via Playwright's cookie-sharing
      # APIRequestContext, not the React UI — see the note below) against
      # the real MySQL service, then asserts the resulting session_data row
      # exists — DB + HTTP together end to end, addressing T4. No other CI
      # job runs DB + HTTP together.
      #
      # After the inline smoke, this job runs the raw-HTTP-only framework-bundle
      # specs (email-link-csrf.spec.ts, cookie-samesite.spec.ts). These don't
      # require the React UI and thus aren't blocked by the chunk-loading issue.
      # consent-csrf.spec.ts still uses UI selectors and remains excluded until
      # the React island lazy-load issue is resolved.
      #
      # Why raw HTTP instead of the full framework-bundle Playwright specs
      # (magic-link.spec.ts etc.): those drive the Auth2 React island
      # through the UI, but the island is lazy-loaded via a dynamic
      # import() (see Bundle/Front/EntryPoints/Auth.ts) that — investigated
      # at length — never fires in this job's environment (zero console
      # errors, zero failed requests, the chunk is simply never requested).
      # That is a separate, deeper rspack chunk-loading question orthogonal
      # to what this job exists to verify (DB + HTTP in a real vendored
      # install); flagged separately rather than silently worked around.
      # Driving the same server-side state machine over HTTP directly is a
      # faithful DB+HTTP regression guard without depending on that chunk.
      - name: Serve + DB-backed HTTP smoke
        working-directory: ${{ runner.temp }}/TestApp
        run: |
          php garnet serve > /tmp/garnet-serve.log 2>&1 &
          SERVER_PID=$!
          up=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8001/ > /dev/null; then up=1; break; fi
            sleep 2
          done
          if [ "$up" != "1" ]; then
            echo "Server did not come up in time." >&2
            echo "--- garnet serve log ---" >&2
            cat /tmp/garnet-serve.log >&2 || true
            echo "--- curl verbose (last attempt) ---" >&2
            curl -v http://localhost:8001/ 2>&1 >&2 || true
            echo "--- PHP error log (if any) ---" >&2
            find WorkDir -iname "*.log" -exec sh -c 'echo "== {} =="; cat "{}"' \; 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Server is up — running the DB+HTTP smoke."
          status=0
          node -e '
          const { request } = require("./Tests/node_modules/@playwright/test");
          const mysql = require("./Tests/node_modules/mysql2/promise");
          (async () => {
            const email = "ci-smoke-" + Date.now() + "@external.example.com";

            const ctx = await request.newContext({ baseURL: "http://localhost:8001" });

            const getRes = await ctx.get("/account");
            if (!getRes.ok()) throw new Error("GET /account failed: " + getRes.status());

            const startRes = await ctx.post("/account", { form: { action: "start-session", consent_pd: "1" } });
            const startBody = await startRes.json();
            if (!startRes.ok() || !startBody.success || !startBody.csrf) {
              throw new Error("start-session failed: " + startRes.status() + " " + JSON.stringify(startBody));
            }

            const codeRes = await ctx.post("/account", { form: { auth_email: email, CSRF_TOKEN: startBody.csrf } });
            const codeBody = await codeRes.json();
            if (!codeRes.ok() || !codeBody.message) {
              throw new Error("request-code failed: " + codeRes.status() + " " + JSON.stringify(codeBody));
            }
            console.log("HTTP flow OK: " + JSON.stringify(codeBody));

            const conn = await mysql.createConnection({ host: "127.0.0.1", port: 3306, user: "test", password: "test", database: "test" });
            try {
              const [rows] = await conn.execute(
                "SELECT sd.value FROM db_session_data sd " +
                "JOIN db_session s ON s.id = sd.sessionId " +
                "JOIN db_session_data sd2 ON sd2.sessionId = s.id AND sd2.param = ? " +
                "WHERE sd.param = ? AND sd2.value = ? ORDER BY sd.id DESC LIMIT 1",
                ["auth_login", "auth_code", email],
              );
              if (!rows.length) throw new Error("no auth_code row found in session_data for " + email);
              console.log("DB row OK: auth_code=" + rows[0].value + " for " + email);
            } finally {
              await conn.end();
            }

            await ctx.dispose();
          })().catch((e) => { console.error("SMOKE FAILED: " + (e && e.stack || e)); process.exitCode = 1; });
          ' || status=$?
          if [ "$status" != "0" ]; then
            echo "--- PHP error log (if any) ---" >&2
            find WorkDir -iname "*.log" -exec sh -c 'echo "== {} =="; cat "{}"' \; 2>/dev/null || true
          fi

          # Run the raw-HTTP framework-bundle specs (email-link-csrf, cookie-samesite)
          # These use playwright.request.newContext() and don't need the React UI.
          if [ "$status" = "0" ]; then
            echo "Running raw-HTTP framework-bundle specs."
            npm --prefix Tests test -- \
              specs/framework-bundle/email-link-csrf.spec.ts \
              specs/framework-bundle/cookie-samesite.spec.ts || status=$?
            if [ "$status" != "0" ]; then
              echo "--- PHP error log (if any) ---" >&2
              find WorkDir -iname "*.log" -exec sh -c 'echo "== {} =="; cat "{}"' \; 2>/dev/null || true
            fi
          fi

          kill "$SERVER_PID" 2>/dev/null || true
          exit $status
