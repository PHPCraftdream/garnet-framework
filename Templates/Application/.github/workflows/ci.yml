name: CI

# This workflow ships inside every scaffolded Garnet app, so a new app
# repo gets CI automatically on its first push.
#
# `app:create` scaffolds against a real Packagist release by default
# (GarnetAppCommand::wireReleaseDependency() strips any path repository
# and pins `require` to a caret constraint), so the app's composer.json
# has no `repositories` entry — `composer install` pulls
# phpcraftdream/garnet-framework straight from Packagist, same as any
# other dependency. No framework sibling checkout, no repository
# patching needed. Modeled on a real app's working CI (IRabi).
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  quality:
    name: App — composer ci (cs-fixer + phpstan + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `.env` is gitignored (may hold local secrets), so a fresh checkout
      # never has it — only `.env.example` ships in git. Without it
      # `GarnetEnv::readAppName()` finds no APP_NAME and every `php garnet`
      # command fails with "No active app."
      - name: Bootstrap .env
        run: cp .env.example .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, fileinfo, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      # GARNET_SKIP_NODE_SETUP suppresses the post-install-cmd's own
      # `garnet setup` call (it would otherwise duplicate the explicit
      # step below and run before Node/npm caching is in place).
      - name: Install PHP deps (pulls garnet-framework from Packagist)
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --prefer-dist --no-interaction

      # npm install for the app + the framework's FrontBuilder (needed by
      # `garnet build` below) + the node_modules junction. No Playwright
      # browsers needed for this PHP-focused job.
      - name: Set up frontend toolchain
        run: php garnet setup --skip-composer --skip-playwright

      - name: App quality gate (cs-fixer + phpstan + build + build:check)
        run: composer ci

  frontend:
    name: App Frontend — oxlint + tsgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap .env
        run: cp .env.example .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, fileinfo, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP deps (pulls garnet-framework from Packagist)
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --prefer-dist --no-interaction

      # tsgo/oxlint resolve `react` etc. through the framework's
      # FrontBuilder node_modules junction, so this is needed even though
      # this job never runs `garnet build` itself.
      - name: Set up frontend toolchain
        run: php garnet setup --skip-composer --skip-playwright

      - name: oxlint + tsgo
        run: npm run check

  e2e:
    name: App E2E — Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap .env
        run: cp .env.example .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, mysqli, fileinfo, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP deps (pulls garnet-framework from Packagist)
        run: GARNET_SKIP_NODE_SETUP=1 composer install --no-progress --prefer-dist --no-interaction

      # App node deps AND Playwright browsers — e2e needs the browsers,
      # so we deliberately do NOT pass --skip-playwright here.
      - name: Set up frontend toolchain + Playwright browsers
        run: php garnet setup --skip-composer

      - name: Build assets
        run: php garnet build

      # Serve + test in ONE step. A background process started in a separate
      # step does not survive into the next one on GitHub-hosted runners, so
      # the server, the readiness wait, and the Playwright run must share a
      # step. The smoke specs are DB-free (db.ini has enabled = 0), so no
      # MySQL service and no config:init / migration is needed.
      - name: Serve + Playwright smoke suite
        run: |
          php garnet serve &
          SERVER_PID=$!
          up=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8001/ > /dev/null; then up=1; break; fi
            sleep 2
          done
          if [ "$up" != "1" ]; then
            echo "Server did not come up in time." >&2
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Server is up — running Playwright."
          npm --prefix Tests test
          status=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $status
